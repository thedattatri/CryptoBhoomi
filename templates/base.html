<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Blockchain-Based Land Registration System — Secure, transparent, and tamper-proof land registration using Ethereum smart contracts.">
  <title>{% block title %}Land Registry{% endblock %} | CryptoBhoomi</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <!-- Theme Preload to prevent FOUC -->
  <script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
  {% block head %}{% endblock %}
</head>

<body>
  {% block body %}{% endblock %}

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Loading Overlay -->
  <div class="loading-overlay hidden" id="loadingOverlay">
    <div class="spinner"></div>
    <p id="loadingText">Processing transaction...</p>
  </div>

  <!-- PDF Popup -->
  <div class="pdf-popup" id="pdfPopup">
    <iframe id="pdfFrame" src=""></iframe>
    <div class="close-btn" onclick="closePdfPopup()">✕</div>
  </div>

  <script src="/static/js/web3.min.js"></script>
  <script src="/static/js/app.js"></script>

  <!-- Floating Theme Toggle Button -->
  <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
    <i class="bi bi-moon-fill" id="themeIcon"></i>
  </button>

  <!-- Set initial icon based on theme -->
  <script>
    if (document.documentElement.getAttribute('data-theme') === 'light') {
      document.getElementById('themeIcon').className = 'bi bi-sun-fill';
    }
  </script>

  {% block scripts %}{% endblock %}
</body>

</html>
