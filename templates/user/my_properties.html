{% extends 'app_layout.html' %}
{% block page_title %}My Properties{% endblock %}
{% block content %}
<div class="page-header"><h1>My Properties</h1><p>All your registered land properties</p></div>
<div class="table-container">
  <table>
    <thead><tr><th>#</th><th>Property ID</th><th>Location</th><th>Dept</th><th>Survey</th><th>Area</th><th>Docs</th><th>Status</th></tr></thead>
    <tbody id="propsBody"><tr><td colspan="8" class="text-center text-muted" style="padding:40px;">Loading...</td></tr></tbody>
  </table>
</div>
{% endblock %}
{% block page_scripts %}
<script>
const SM={0:'Pending',1:'Scheduled',2:'Verified',3:'Rejected',4:'On Sale',5:'Bought'};
const SB={0:'badge-warning',1:'badge-info',2:'badge-success',3:'badge-danger',4:'badge-purple',5:'badge-success'};
(async()=>{
  const account=localStorage.getItem('userAddress');
  if(!account){window.location.href='/';return;}
  try{
    const abi=JSON.parse(localStorage.getItem('LandRegistry_ContractABI'));
    const addr=localStorage.getItem('LandRegistry_ContractAddress');
    const c=new web3.eth.Contract(abi,addr);
    const props=await c.methods.getPropertiesOfOwner(account).call();
    if(!props.length){document.getElementById('propsBody').innerHTML='<tr><td colspan="8" class="text-center text-muted" style="padding:40px;">No properties found</td></tr>';return;}
    let h='';
    props.forEach((p,i)=>{
      const s=parseInt(p.state);
      h+=`<tr><td>${i+1}</td><td><strong>${p.propertyId}</strong></td><td>${p.locationId}</td><td>${p.revenueDepartmentId}</td><td>${p.surveyNumber}</td><td>${p.area}</td><td><button class="btn btn-sm btn-secondary" onclick="document.getElementById('pdfFrame').src='/api/property-doc/${p.propertyId}';document.getElementById('pdfPopup').classList.add('active')"><i class="bi bi-file-pdf"></i></button></td><td><span class="badge ${SB[s]}">${SM[s]}</span></td></tr>`;
    });
    document.getElementById('propsBody').innerHTML=h;
  }catch(e){console.error(e);showToast('Error loading','error');}
})();
</script>
{% endblock %}
